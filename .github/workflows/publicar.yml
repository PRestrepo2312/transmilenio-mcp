name: publicar

# Sube el paquete a PyPI con Trusted Publishing: PyPI confía en este workflow y no hace
# falta guardar tokens. Corre al publicar una versión en GitHub o a mano.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/transmilenio-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
