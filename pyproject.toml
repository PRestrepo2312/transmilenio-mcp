[project]
name = "transmilenio-mcp"
version = "0.1.3"
description = "Buses de TransMilenio en vivo para Claude (MCP) y un mapa local. Sin API key: lee los datos abiertos de TransMilenio S.A."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pedro Restrepo" }]
keywords = ["transmilenio", "bogota", "gtfs", "gtfs-realtime", "mcp", "transporte-publico"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Natural Language :: Spanish",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "mcp>=2.3,<3",
  "gtfs-realtime-bindings>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repositorio = "https://github.com/PRestrepo2312/transmilenio-mcp"
Cambios = "https://github.com/PRestrepo2312/transmilenio-mcp/blob/main/CHANGELOG.md"
Problemas = "https://github.com/PRestrepo2312/transmilenio-mcp/issues"

[project.scripts]
transmilenio-mcp = "transmilenio_mcp.servidor_mcp:main"
transmilenio-web = "transmilenio_mcp.servidor_web:main"
transmilenio-indice = "transmilenio_mcp.datos.gtfs_estatico:main"
transmilenio-veedor = "transmilenio_mcp.recolector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Las imágenes son del README; para instalar no hacen falta.
exclude = ["docs/img", "docs/video", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/transmilenio_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
